# Build the disc and run the smoke test on a Model B and a Master 128, with
# baron pinned to a release.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BARON_VERSION: v0.6.0

jobs:
  check:
    name: make check (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [B-DFS1.2, Master]
    steps:
      - uses: actions/checkout@v4

      - name: Cache baron
        id: baron
        uses: actions/cache@v4
        with:
          path: baron-bin
          key: baron-${{ env.BARON_VERSION }}-${{ runner.os }}

      - name: Build baron ${{ env.BARON_VERSION }}
        if: steps.baron.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch "$BARON_VERSION" --recurse-submodules \
            https://github.com/waitingforvsync/baron baron-src
          cmake -S baron-src -B baron-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build baron-src/build -j
          mkdir -p baron-bin
          cp baron-src/build/src/baron baron-bin/

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up
        run: |
          npm ci
          pip install pillow

      - name: make check
        run: make check MODEL=${{ matrix.model }} BARON="$PWD/baron-bin/baron"
